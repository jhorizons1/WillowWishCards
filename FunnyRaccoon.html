<body>

  <div class="card share-card">

    <img
      src="FunnyRaccoon.png"
      alt="A colorful cartoon raccoon sits at a cluttered desk surrounded by coffee cups, cookies, chips, popcorn, and towering stacks of paperwork. Looking tired and overwhelmed,
          the raccoon holds a coffee mug beside an open laptop while the humorous message above reads, 'I'm doing my best. Unfortunately, my best is currently on a snack break.' "
      class="card-image horizontal-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Snack Break",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
