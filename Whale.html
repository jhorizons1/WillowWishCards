<body>

  <div class="card share-card">

    <img
      src="WhaleOfAFriend.png"
      alt="A heartwarming friendship card featuring a smiling blue whale swimming in a calm ocean at sunset. The whale creates a heart-shaped spray of water above its head as golden and pink light reflects across the waves. The card reads: “Whale of a Friend” and “I'm lucky to swim through life with you.” Warm sunset colors and a cheerful ocean scene create a friendly and uplifting atmosphere."
      class="card-image vertical-card-img"
    />
    <br>

    <h4>&#129767;You're A Whale of a Friend&#129767;</h4>

    <p class="message">
      Thanks for always making waves of kindness wherever you go.
      You're truly a whale of a friend!
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Whale of a Friend",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
