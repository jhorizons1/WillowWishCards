<body>

  <div class="card share-card">

    <img
      src="GiraffeIAP.png"
      alt="A whimsical ink and pencil illustration of a giraffe standing on a ladder, using a paintbrush to add glowing stars to the evening sky. A crescent moon shines above a 
        cozy village, while decorative swirling borders frame the artwork. The card includes the message: 'The world is brighter because you're in it.' "
      class="card-image vertical-card-img"
    />
    

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "The World is Brighter Because You're In It",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
