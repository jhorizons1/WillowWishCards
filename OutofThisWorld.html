<body>

  <div class="card share-card">

    <img
      src="OutofThisWorld.png"
      alt="You're out of this world"
      class="card-image verticle-card-img"
    />
    <br>

    <h4>&#128125;!You're Out of This World!&#128125;</h4>

    <p class="message">
     Keep reaching for the stars - the universe is brighter with you in it.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "You're Out of This World",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
