<body>

  <div class="card share-card">

    <img
      src="PaperAirplane.png"
      alt="Hand drawn paper airplane flying through a blue sky with fluffy clouds and a heart-shaped flight path. Greeting card reads, 'Just Sending a little Happiness Your Way.' "
      class="card-image vertical-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Sending Happiness",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
