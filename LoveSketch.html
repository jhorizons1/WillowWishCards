<body>

  <div class="card share-card">

    <img
      src="LoveSketch.png"
      alt="A vintage-inspired love card featuring a lace-trimmed heart with the message 'I Love You' in elegant script. Pink roses, ribbons, and delicate floral details surround the heart, while a teddy bear holding a small heart sits at the bottom. The design has a soft, romantic feel with pastel pink tones and intricate decorative accents."
      class="card-image vertical-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "I Love You",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
