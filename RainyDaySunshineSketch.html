<body>

  <div class="card share-card">

      src="RainyDaySunshineSketch.png"
      alt="An ink-and-pencil style greeting card featuring a bright sunflower growing beside a rustic wooden fence under a warm sun breaking through light clouds. The card reads: “You're my sunshine, even on cloudy days.” Soft watercolor details, wildflowers, and a peaceful countryside setting create a cheerful and uplifting atmosphere."

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Sunshine on a Cloudy Day",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
