<body>

  <div class="card share-card">

    <img
      src="FunnySquirrel.png"
      alt="Funny cartoon squirrel struggling to carry a giant pile of acorns with the quote 'I'm not overthinking. I'm just prepared for every possible scenario.""
      class="card-image verticle-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "I'm not overthinking...",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
