<body>

  <div class="card share-card horizontal-card">

    <img
      src="CoffeePeace.png"
      alt="Cozy coffee-themed greeting card featuring two heart-topped cups of coffee, soft flowers, and the message 'Sharing coffee with you is my favorite kind of peace.' "
      class="card-image"
    />
    <br>

    <h3>&#9749;Coffee Friends&#9749;</h3>

    <p class="message">
      Thank you for being someone who makes every moment feel a little brighter.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Coffee Friend",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
