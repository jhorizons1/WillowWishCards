<body>

  <div class="card share-card">

    <img
      src="DuckSplashingInPuddle.png"
      alt="Cute duck wearing yellow rain boots splashing in a puddle with the speech bubble, "Why be boring when you can be QUACKY?" A funny, cheerful greeting e-card celebrating fun and being yourself."
      class="card-image vertical-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Be Quacky!",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
