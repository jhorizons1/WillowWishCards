<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>You're My Sunshine</title>

  <link rel="stylesheet" href="styles.css" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XDQZ6QW7JZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XDQZ6QW7JZ');
</script>
 
</head>

<body>

  <div class="card share-card horizontal-card">

    <img
      src="Sunshine.png"
      alt="You're my sunshine"
      class="card-image hedgehog-card-img"
    />
    <br>

    <h3>&#9728;You're My Sunshine&#9728;</h3>

    <p class="message">
      No matter the weather, you make life shine.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "You're My Sunshine",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
</html>
