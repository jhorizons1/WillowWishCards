<body>

  <div class="card share-card">

    <img
      src="SpaceBirthday.png"
      alt="A colorful space-themed birthday card featuring a giant galaxy-inspired cupcake with glowing candles, surrounded by stars, planets, and swirling galaxies. A small astronaut holds a gift while floating through space. The card reads: “Happy Birthday!” and includes a birthday wish for joy, love, laughter, and a little magic. Vibrant purple, blue, and pink cosmic colors create a fun, whimsical celebration scene."
      class="card-image vertical-card-img"
    />
    <br>
    <h3>&#127874;!Happy Birthday!&#127874;</h3>

    <p class="message">
      May your year be filled with laughter, magic, friendship, and moments that shine as brightly as the stars!
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Happy Birthday!",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
