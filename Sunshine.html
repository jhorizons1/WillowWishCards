<body>

  <div class="card share-card horizontal-card">

    <img
      src="Sunshine.png"
      alt="A cheerful greeting card featuring a smiling hedgehog holding a yellow umbrella while standing in a rain-soaked countryside path. A happy sun peeks through the clouds as raindrops fall around blooming flowers and a rustic fence. The card reads: “You're My Sunshine.” Warm golden light, colorful flowers, and a hopeful rainy-day scene create a bright and uplifting atmosphere."
      class="card-image"
    />
    <br>

    <h3>&#9728;You're My Sunshine&#9728;</h3>

    <p class="message">
      No matter the weather, you make life shine.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "You're My Sunshine",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
