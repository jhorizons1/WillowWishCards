<body>

  <div class="card share-card horizontal-card">

    <img
      src="Hedgehog.png"
      alt="Glad we crossed paths"
      class="card-image hedgehog-card-img"
    />
    <br>

    <h4>&#129428;I'm Glad We Crossed Paths&#129428;</h4>

    <p class="message">
      Keep rolling forward. Good things are waiting around the corner.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "I'm glad our we crossed paths",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
