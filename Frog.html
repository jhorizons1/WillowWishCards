<meta property="og:title" content="Wishing You Lots of Luck! | WillowWish Cards">

<meta name="twitter:card" content="summary_large_image">

<body>

  <div class="card share-card">

    <img
      src="FrogLuck.png"
      alt="Cheerful good luck greeting card featuring a smiling frog holding a four-leaf clover whiile sitting on a lily pad surrounded by blooming water lilies."
      class="card-image horizontal-card"
    />
    <br>

    <h2>&#127808;!Good Luck!&#127808;</h2>

    <p class="message">
      Sending lucky vibes and a pocket full of clovers.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Lucky Frog",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
