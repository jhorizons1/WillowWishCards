<body>

  <div class="card share-card">

    <img
      src="NorthStar.png"
      alt="You're my North Star card"
      class="card-image verticle-card-img"
    />
    <br>
    <h3>&#127775;You're my North Star&#127775;</h3>

    <p class="message">
     Through every journey, every dream, and every starry night, you're my North Star.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "North Star",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
