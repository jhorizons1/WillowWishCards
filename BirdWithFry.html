<body>

  <div class="card share-card">

    <img
      src="BirdWithFry.png"
      alt="A cheerful cartoon bird proudly carrying a giant golden French fry that is much larger than itself, creating a playful and humorous scene on a colorful greeting card."
      class="card-image verticle-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Dream Big",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
