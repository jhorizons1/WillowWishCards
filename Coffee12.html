<body>

  <div class="card share-card">

    <img
      src="DiamondCoffee.png"
      alt="Heart shaped coffee cup filled with coffee beneath glowing gold cursive LOVE lettering as black diamonds fall through a dark elegant background."
      class="card-image verticle-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Coffee",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
