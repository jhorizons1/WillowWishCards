<body>

  <div class="card share-card">

    <img
      src="FoxIAP.png"
      alt="A hand-drawn ink and pencil illustration of a small fox carrying a glowing lantern along a forest path at dusk. Delicate trees, flowers, and mushrooms surround the fox, while decorative
          swirling borders frame the scene. The card includes the message: 'Even the smallest light can guide the way.' "
      class="card-image vertical-card-img"
    />
    

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Even The Smallest Light",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
