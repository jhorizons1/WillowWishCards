<body>

  <div class="card share-card">

    <img
      src="SquirrelMoon.png"
      alt="A whimsical love card featuring a smiling crescent moon and a flying squirrel soaring through a starry night sky above Earth. A trail of sparkling stardust connects the moon to the planet below. The card reads: “Love You to the Moon and Back.” Warm golden light, twinkling stars, and a dreamy cosmic scene create a sweet and affectionate atmosphere."
      class="card-image vertical-card-img"
    />
    <br>
    <h3>&#10084;Love You!&#10084;</h3>

    <p class="message">
    From the moon to the earth and everywhere in between, you'll always be loved.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Love You!",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
