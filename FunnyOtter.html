<body>

  <div class="card share-card">

    <img
      src="FunnyOtter.png"
      alt="A happy otter floats on its back in a peaceful river, proudly holding a fish above its head like a trophy while celebrating with a big smile. The card reads, 'Just wanted you to know... I'm still winning.' "
      class="card-image vertical-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Still Winning",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
