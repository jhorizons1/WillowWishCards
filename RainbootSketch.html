<body>

  <div class="card share-card">

    <img
      src="RainbootSketch.png"
      alt="A delicate ink-and-pencil style greeting card featuring a teal rain boot filled with colorful wildflowers, including daisies and lavender. The card reads: 'Beautiful things grow after rainy days.' Soft watercolor details, gentle floral accents, and a clean white background create an uplifting and hopeful atmosphere."

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Beautiful Things From Rainy Days",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
