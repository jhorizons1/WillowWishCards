<body>

  <div class="card share-card horizontal-card">

    <img
      src="Love.png"
      alt="A simple watercolor-style greeting card featuring a large pink heart surrounded by small green hearts on a light background. The message inside the heart reads: 'I love you more than you know.' The design has a warm, affectionate feel with soft colors and a hand-painted look."
      class="card-image"
    />
     <br>
    <h3>&#128155;I LOVE YOU&#128155;</h3>

    <p class="message">
     You are loved more than you'll ever truly know.
    </p>

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "I Love You More Than You Know",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>

</body>
