<body>

  <div class="card share-card">

    <img
      src="GirlSquirrelSketch.png"
      alt="Ink and pencil illustration of a squirrel planting a crescent moon in the ground surrounded by star flowers with the quote 'You plant a little wonder wherever you go'"
      class="card-image verticle-card-img"
    />
 
    

   

    <button class="share-btn" onclick="shareCard()">
      Share This Card &#10024;
    </button>

  </div>

  <script>
    function shareCard() {

      if (navigator.share) {

        navigator.share({
          title: "Planting Wonder",
          text: "Check out this greeting card!",
          url: window.location.href
        })

        .then(() => console.log("Shared successfully"))
        .catch((error) => console.log("Error sharing:", error));

      } else {

        alert("Sharing is not supported on this browser.");

      }
    }
  </script>
